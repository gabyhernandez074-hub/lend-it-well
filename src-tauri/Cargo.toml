[package]
name = "pocalana"
version = "0.1.0"
description = "Pocalana library inventory"
authors = ["Pocalana"]
edition = "2021"

[lib]
name = "pocalana_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9", features = [] }
